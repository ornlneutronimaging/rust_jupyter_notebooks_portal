[package]
name = "rust_jupyter_notebooks_portal"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[profile.release]
lto = "thin"
